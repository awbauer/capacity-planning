name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npx vitest run
      - run: npm run build
      # Explicit config forces source bundling, as wrangler preview does after its custom build.
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc

  e2e:
    name: End-to-end (local, shared workspace, adversarial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Starts the app with its Worker and Durable Objects (dev sign-in from .dev.vars.example).
      - run: npm run test:e2e:serve
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: work/e2e/shots
